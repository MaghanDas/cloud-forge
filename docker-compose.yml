services:
  api:
    build: .
    container_name: cloudforge-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudforge

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16

    container_name: cloudforge-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudforge

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cloudforge"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: